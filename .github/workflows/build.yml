# macOS(인텔·Apple 칩 겸용)·Windows·Linux 에서 빌드하고, 앱을 띄워 샘플 문서 렌더를 자동 점검한다.
#  - main 에 push · pull request · 직접 실행: 빌드 + 점검. 설치 파일과 화면 캡처는 실행 기록의 Artifacts 에
#  - v* 태그 push: 위에 더해 GitHub Release 를 만들고 설치 파일을 올린다
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release 만들기 (세 빌드가 여기에 파일을 올린다)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="설치 방법: https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALL.md · 바뀐 점: https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "MD Viewer $GITHUB_REF_NAME" --notes "$NOTES" || true

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            args: --target universal-apple-darwin
            bin: src-tauri/target/universal-apple-darwin/release/md-viewer
          - os: windows-latest
            label: windows
            args: ''
            bin: src-tauri/target/release/md-viewer.exe
          - os: ubuntu-22.04
            label: linux
            args: ''
            bin: src-tauri/target/release/md-viewer
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 리눅스 빌드 도구
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick fonts-noto-cjk

      - run: npm ci

      # 코드 검사: 형식(rustfmt)과 흔한 실수·군더더기(clippy). 운영체제마다 다른 코드가 있어 세 곳 모두에서 돈다.
      - name: 코드 검사
        shell: bash
        run: |
          node scripts/build-web.mjs
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: 빌드 (태그면 Release 에 올림)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'MD Viewer ${{ github.ref_name }}'
          releaseDraft: false

      - name: 자체 점검 (맥·리눅스)
        if: matrix.label != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = linux ]; then
            export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
            xvfb-run -a -s "-screen 0 1400x1100x24" bash scripts/ci-selftest.sh "${{ matrix.bin }}" linux
          else
            bash scripts/ci-selftest.sh "${{ matrix.bin }}" macos
          fi

      - name: 자체 점검 (윈도우)
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./scripts/ci-selftest.ps1 -Bin "${{ matrix.bin }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-viewer-${{ matrix.label }}
          retention-days: 14
          path: |
            selftest-*/
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
