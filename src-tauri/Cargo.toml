[package]
name = "md-viewer"
version = "0.1.0"
description = "MD Viewer — 보기 전용 마크다운 뷰어"
authors = ["monojun"]
license = "MIT"
repository = "https://github.com/monojun/md-viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8.44"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
