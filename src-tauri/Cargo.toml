[package]
name = "md-viewer"
version = "0.2.0"
description = "MD Viewer — 보기 전용 마크다운 뷰어"
authors = ["monojun"]
license = "MIT"
repository = "https://github.com/monojun/md-viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8.44"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# 자체 점검에서 맥 '윈도우' 메뉴가 제대로 등록됐는지 읽어 보는 데만 쓴다 (Tauri 가 이미 쓰는 판과 같게)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
